[project]
name = "dubdeck"
version = "0.2.0"
description = "Dubdeck: copy Spotify playlists to YouTube Music"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "ytmusicapi>=1.12.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.vercel]
entrypoint = "app.main:app"
